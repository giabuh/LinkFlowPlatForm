services:
  postgres:
    image: postgres:16
    container_name: linkflow-postgres
    environment:
      POSTGRES_DB: linkflow_db
      POSTGRES_USER: linkflow_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "5432:5432"
    volumes:
      - linkflow_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: linkflow-redis
    ports:
      - "6379:6379"
    volumes:
      - linkflow_redis_data:/data

volumes:
  linkflow_postgres_data:
  linkflow_redis_data:
