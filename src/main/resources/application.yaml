server:
  port: 8080
spring:
  application:
    name: LinkFlowPlatform
  datasource:
    url: jdbc:postgresql://localhost:5432/linkflow_db
    username: linkflow_user
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
app:
  jwt:
    # Production MUST override this via the APP_JWT_SECRET env var. The default below is a
    # throwaway development value only (the previously committed secret has been rotated out).
    secret: ${APP_JWT_SECRET:dev-insecure-secret-do-not-use-in-prod-0123456789}
    access-token-expiration-ms: 900000 #15m
    refresh-token-expiration-ms: 604800000 #7day
  auth:
    refresh-cookie:
      name: refresh_token
      http-only: true
      secure: false
      same-site: Lax
      path: /api/v1/auth/refresh
